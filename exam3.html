    actionHtml = `<div class="btn-row" style="margin-top:1rem">
      <button class="primary" onclick="checkBlankGroup(${gi})">이 장 채점</button>
    </div>`;
  } else {
    actionHtml = `<div class="btn-row" style="margin-top:1rem">
      <button onclick="retryBlankGroup(${gi})">이 장 다시 풀기</button>
      ${isLast||groups.every(x=>x.checked) ? `<button class="primary" onclick="finishBlankAll()">전체 결과 보기 →</button>`:''}
    </div>`;
  }

  const navHtml = `<div class="nav-row">
    ${gi>0?`<button onclick="goBlankGroup(${gi-1})">← 이전</button>`:'<span></span>'}
    ${!isLast?`<div class="nav-right"><button class="primary" onclick="goBlankGroup(${gi+1})">다음 →</button></div>`:''}
  </div>`;

  const modeLabel = g.mode==='A'?'A. 절별 빈칸':g.mode==='B'?'B. 다중 절 빈칸':'C. 다중 절 전문 쓰기';

  area.innerHTML = `
    <div class="progress-row">
      <span class="prog-label">${gi+1} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="score-pill pill-exam">${modeLabel}</span>
    </div>
    <div class="q-jump-row">${dotsHtml}${controlsHtml}</div>
    <div class="card">
      <span class="q-num">${g.chapterRef}</span>
      <div class="q-title">빈칸채우기</div>
      ${bodyHtml}
      ${actionHtml}
    </div>
    ${navHtml}
    <div class="btn-row" style="margin-top:.5rem">
      <button class="sm" onclick="backToBlankSetup()">⚙️ 설정으로 돌아가기</button>
    </div>`;

  // readonly 처리는 buildVerseHtml/textarea 렌더링에서 이미 처리됨
  if(!g.checked){
    // 빈칸 입력 저장 + 엔터로 다음 빈칸 이동
    const allBlankInputs = Array.from(area.querySelectorAll('.blank-input'));
    allBlankInputs.forEach((inp,bi)=>{
      inp.oninput = ()=>{ g.answers[inp.dataset.key] = inp.value; };
      inp.onkeydown = (e)=>{
        if(e.key!=='Enter'||e.shiftKey) return;
        if(e.isComposing||e.keyCode===229) return; // 한글 IME 조합 중 엔터 무시
        e.preventDefault();
        g.answers[inp.dataset.key] = inp.value;
        const next = allBlankInputs[bi+1];
        if(next){ next.focus(); next.select(); }
        else { inp.blur(); }
      };
    });
    // textarea 입력 저장
    area.querySelectorAll('.blank-fulltext').forEach(ta=>{
      ta.oninput = ()=>{ g.answers[ta.dataset.key] = ta.value; };
    });
  }
}

function goBlankGroup(idx){ BLANK_STATE.groupIdx = idx; render(); window.scrollTo({top:0,behavior:'smooth'}); }

// 절들을 2~5개씩 무작위로 묶음(bundle) 구성
function buildBundles(allVerses, subMode){
  let pool = [...allVerses];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const bundles = [];
  while(pool.length>0){
    const size = Math.min(2+Math.floor(Math.random()*4), pool.length); // 2~5
    bundles.push(pool.splice(0,size));
  }
  const orderMap = {}; allVerses.forEach((v,i)=>orderMap[v.v]=i);
  return bundles.map(bundle=>{
    const sorted = [...bundle].sort((a,b)=>orderMap[a.v]-orderMap[b.v]);
    if(subMode==='B'){
      const verses = sorted.map(v=>({vref:v.v, text:v.text, blanks: pickBlanksForVerse(v.text, BLANK_STATE.difficulty)}));
      return {verses};
    } else {
      const verses = sorted.map(v=>({vref:v.v, text:v.text}));
      return {verses};
    }
  });
}

// 절섞기 토글 — 켜면 절/묶음 순서를 무작위로, 끄면 원래(성경) 순서로 복원
function toggleVerseOrderShuffle(gi){
  const g = BLANK_STATE.groups[gi];
  if(g.checked) return; // 채점 후에는 변경 불가
  g.verseOrderShuffled = !g.verseOrderShuffled;

  if(g.mode==='A'){
    if(g.verseOrderShuffled){
      // 무작위 순서로 섞기 (빈칸은 유지)
      for(let i=g.verses.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [g.verses[i],g.verses[j]]=[g.verses[j],g.verses[i]]; }
    } else {
      // 원래 성경 순서로 복원 (빈칸은 유지, vref 기준 매핑)
      const map = {}; g.verses.forEach(v=>map[v.vref]=v);
      g.verses = g.allVerses.map(v=>map[v.v]);
    }
  } else {
    // B, C: 절 순서는 항상 1,2,3... 그대로 유지하고, 묶음 크기(2~5)만 다시 무작위로 재구성
    g.bundles = buildOrderedBundles(g.allVerses, g.mode);
  }
  render();
}

// 원문 순서 그대로 2~5개씩 순차적으로 묶기 (절섞기 OFF 상태용)
function buildOrderedBundles(allVerses, subMode){
  const bundles = [];
  let i=0;
  while(i<allVerses.length){
    const size = Math.min(2+Math.floor(Math.random()*4), allVerses.length-i);
    const chunk = allVerses.slice(i, i+size);
    i += size;
    if(subMode==='B'){
      const verses = chunk.map(v=>({vref:v.v, text:v.text, blanks: pickBlanksForVerse(v.text, BLANK_STATE.difficulty)}));
      bundles.push({verses});
    } else {
      const verses = chunk.map(v=>({vref:v.v, text:v.text}));
      bundles.push({verses});
    }
  }
  return bundles;
}

function shuffleBlankGroup(gi){
  const g = BLANK_STATE.groups[gi];
  if(g.mode==='A'){
    g.verses.forEach(v=>{ v.blanks = pickBlanksForVerse(v.text, BLANK_STATE.difficulty); });
  } else if(g.mode==='B'){
    g.bundles.forEach(bundle=>{
      bundle.verses.forEach(v=>{ v.blanks = pickBlanksForVerse(v.text, BLANK_STATE.difficulty); });
    });
  }
  render();
}

// ── 채점 모드 전환 (장별 ↔ 절별) ──
function toggleGradeMode(){
  BLANK_STATE.gradeMode = (BLANK_STATE.gradeMode==='chapter') ? 'verse' : 'chapter';
  render();
}

function hasAnyItemChecked(g){
  if(g.mode==='A') return g.verses.some(v=>v.checked);
  return g.bundles.some(b=>b.checked);
}
function allItemsChecked(g){
  if(g.mode==='A') return g.verses.every(v=>v.checked);
  return g.bundles.every(b=>b.checked);
}

// 절별/묶음별 개별 채점 (절별 채점 모드)
function checkVerseItem(gi, itemIdx){
  const g = BLANK_STATE.groups[gi];

  // 현재 화면의 입력값 저장
  document.querySelectorAll('.blank-input').forEach(inp=>{ g.answers[inp.dataset.key] = inp.value; });
  document.querySelectorAll('.blank-fulltext').forEach(ta=>{ g.answers[ta.dataset.key] = ta.value; });

  let total=0, correct=0;

  if(g.mode==='A'){
    const v = g.verses[itemIdx];
    v.blanks.forEach((b,bi)=>{
      total++;
      const key = `bk_g${gi}_v${itemIdx}_${bi}`;
      const userVal = g.answers[key] || '';
      if(isMatch(userVal, b.word)) correct++;
    });
    v.checked = true; v.allCorrect = (correct===total); v.correctCount = correct; v.totalCount = total;
  } else if(g.mode==='B'){
    const bundle = g.bundles[itemIdx];
    bundle.verses.forEach((v,vi)=>{
      v.blanks.forEach((b,bki)=>{
        total++;
        const key = `bk_g${gi}_b${itemIdx}_v${vi}_${bki}`;
        const userVal = g.answers[key] || '';
        if(isMatch(userVal, b.word)) correct++;
      });
    });
    bundle.checked = true; bundle.allCorrect = (correct===total); bundle.correctCount = correct; bundle.totalCount = total;
  } else { // C
    const bundle = g.bundles[itemIdx];
    total = 1;
    const k = `g${gi}_b${itemIdx}`;
    const fullText = bundle.verses.map(v=>v.text).join(' ');
    const userVal = g.answers[k] || '';
    if(isMatch(userVal, fullText)) correct = 1;
    bundle.checked = true; bundle.allCorrect = (correct===total); bundle.correctCount = correct; bundle.totalCount = total;
  }

  // 오답노트 등록 (절별 모드 - chungukgosi 패턴과 맞추어 wrongNote 사용은 생략, 자체 결과화면에서 처리)

  render();

  // 그룹 전체가 다 채점되면 g.checked/allCorrect도 갱신 (도트 표시/100점 세레모니용)
  if(allItemsChecked(g)){
    const items = g.mode==='A' ? g.verses : g.bundles;
    const allOk = items.every(it=>it.allCorrect);
    g.checked = true;
    g.allCorrect = allOk;
    g.correctCount = items.reduce((s,it)=>s+(it.correctCount||0),0);
    g.totalCount = items.reduce((s,it)=>s+(it.totalCount||0),0);
    if(allOk){ setTimeout(showPerfect,400); }
  }
}

function retryVerseItem(gi, itemIdx){
  const g = BLANK_STATE.groups[gi];
  if(g.mode==='A'){
    const v = g.verses[itemIdx];
    v.checked = false; v.allCorrect=false; v.correctCount=0; v.totalCount=0;
    // 빈칸 위치는 유지, 입력값만 지움
    v.blanks.forEach((b,bi)=>{ delete g.answers[`bk_g${gi}_v${itemIdx}_${bi}`]; });
  } else {
    const bundle = g.bundles[itemIdx];
    bundle.checked = false; bundle.allCorrect=false; bundle.correctCount=0; bundle.totalCount=0;
    if(g.mode==='B'){
      bundle.verses.forEach((v,vi)=>{
        v.blanks.forEach((b,bki)=>{ delete g.answers[`bk_g${gi}_b${itemIdx}_v${vi}_${bki}`]; });
      });
    } else { // C
      delete g.answers[`g${gi}_b${itemIdx}`];
    }
  }
  g.checked = false; // 그룹 전체 채점 상태 해제
  render();
}

function checkBlankGroup(gi){
  const g = BLANK_STATE.groups[gi];
  let total=0, correct=0;

  // 현재 화면의 입력값을 g.answers에 먼저 저장 (oninput으로 이미 저장되지만 안전하게 한 번 더)
  document.querySelectorAll('.blank-input').forEach(inp=>{ g.answers[inp.dataset.key] = inp.value; });
  document.querySelectorAll('.blank-fulltext').forEach(ta=>{ g.answers[ta.dataset.key] = ta.value; });

  if(g.mode==='A'){
    g.verses.forEach((v,vi)=>{
      v.blanks.forEach((b,bi)=>{
        total++;
        const key = `bk_g${gi}_v${vi}_${bi}`;
        const userVal = g.answers[key] || '';
        if(isMatch(userVal, b.word)) correct++;
      });
    });
  } else if(g.mode==='B'){
    g.bundles.forEach((bundle,bi)=>{
      bundle.verses.forEach((v,vi)=>{
        v.blanks.forEach((b,bki)=>{
          total++;
          const key = `bk_g${gi}_b${bi}_v${vi}_${bki}`;
          const userVal = g.answers[key] || '';
          if(isMatch(userVal, b.word)) correct++;
        });
      });
    });
  } else { // C
    g.bundles.forEach((bundle,bi)=>{
      total++;
      const k = `g${gi}_b${bi}`;
      const fullText = bundle.verses.map(v=>v.text).join(' ');
      const userVal = g.answers[k] || '';
      if(isMatch(userVal, fullText)) correct++;
    });
  }

  g.checked = true;
  g.allCorrect = (correct===total);
  g.correctCount = correct;
  g.totalCount = total;

  render();
  if(g.allCorrect){ setTimeout(showPerfect,400); }
}

function retryBlankGroup(gi){
  const g = BLANK_STATE.groups[gi];
  g.checked = false;
  g.answers = {}; // 빈칸 위치는 유지, 입력값만 초기화
  if(g.mode==='A'){
    g.verses.forEach(v=>{
      v.checked=false; v.allCorrect=false; v.correctCount=0; v.totalCount=0;
    });
  } else if(g.mode==='B'){
    g.bundles.forEach(bundle=>{
      bundle.checked=false; bundle.allCorrect=false; bundle.correctCount=0; bundle.totalCount=0;
    });
  } else { // C
    g.bundles.forEach(bundle=>{
      bundle.checked=false; bundle.allCorrect=false; bundle.correctCount=0; bundle.totalCount=0;
    });
  }
  render();
}

// 작성한 입력값만 비우는 초기화 (채점 여부 무관, 빈칸 위치/절 순서는 유지)
function resetBlankGroup(gi){
  if(!confirm('이 장에 작성한 내용을 모두 초기화할까요?')) return;
  const g = BLANK_STATE.groups[gi];
  g.checked = false;
  g.answers = {};
  if(g.mode==='A'){
    g.verses.forEach(v=>{ v.checked=false; v.allCorrect=false; v.correctCount=0; v.totalCount=0; });
  } else {
    g.bundles.forEach(bundle=>{ bundle.checked=false; bundle.allCorrect=false; bundle.correctCount=0; bundle.totalCount=0; });
  }
  render();
}

function finishBlankAll(){ BLANK_STATE.step='result'; render(); }

function renderBlankResult(area){
  const groups = BLANK_STATE.groups;
  let totalQ=0, totalC=0;
  const chapterStats = groups.map(g=>{
    totalQ += g.totalCount||0;
    totalC += g.correctCount||0;
    return { ref:g.chapterRef, correct:g.correctCount||0, total:g.totalCount||0 };
  });
  const pct = totalQ>0 ? Math.round(totalC/totalQ*100) : 0;
  const msg = pct===100?'완벽합니다!':pct>=80?'아주 잘 하셨어요!':pct>=60?'조금만 더 연습해 봐요!':'반복 학습해 보세요.';

  const chapterHtml = chapterStats.map(c=>`<div class="wrong-item"><div class="wq">${escHtml(c.ref)}</div><div class="wa">${c.correct} / ${c.total} 정답</div></div>`).join('');

  area.innerHTML = `<div class="score-screen">
    <div class="score-circle"><div class="score-num">${pct}%</div><div class="score-sub">${totalC}/${totalQ}</div></div>
    <div class="score-msg">${msg}</div>
    <div class="score-btn-row">
      <button onclick="backToBlankSetup()">새 빈칸채우기 시작</button>
    </div>
    <div class="wrong-list"><div class="wrong-list-title">장별 결과</div>${chapterHtml}</div>
  </div>`;
}

function backToBlankSetup(){
  BLANK_STATE = { step:'setup', selectedChapters:[], subMode:null, difficulty:'mid', gradeMode:'chapter', groups:[], groupIdx:0 };
  render();
}

// ════════════════════════════════════════════
// 에빙하우스 기반 D-Day 로드맵
// ════════════════════════════════════════════
const GOSI_DATE    = new Date(2026, 8, 12);  // 9월 12일(토) 고시일
const TOTAL_VERSES = 85;                      // 13~17장 전체 절수
const POLISH_WEEKS = 2;                       // 고시 2주 전부터 다듬기

// 암기 완료 목표일 = 고시일 - 2주
function getMemorizeDeadline(){
  const d = new Date(GOSI_DATE);
  d.setDate(d.getDate() - POLISH_WEEKS * 7);
  return d;
}

function daysBetween(a, b){
  const d1 = new Date(a); d1.setHours(0,0,0,0);
  const d2 = new Date(b); d2.setHours(0,0,0,0);
  return Math.round((d2 - d1) / 86400000);
}

function toInputDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 학습 시작일 (localStorage, 사용자 설정 가능)
let STUDY_START = (function(){
  const saved = store.get('gosi3_start_date');
  if(saved){ const d=new Date(saved); if(!isNaN(d)) return d; }
  const today = new Date(); today.setHours(0,0,0,0);
  store.set('gosi3_start_date', toInputDate(today));
  return today;
})();

function setStudyStart(val){
  if(!val) return;
  const d = new Date(val+'T00:00:00');
  if(isNaN(d)) return;
  d.setHours(0,0,0,0);
  STUDY_START = d;
  store.set('gosi3_start_date', val);
  renderDdayRoadmap();
}

// 오늘의 신규 진도 계산
function getTodayPortion(){
  const today = new Date(); today.setHours(0,0,0,0);
  const deadline = getMemorizeDeadline();
  const totalDays = Math.max(1, daysBetween(STUDY_START, deadline) + 1);
  const dayIndex  = Math.max(0, daysBetween(STUDY_START, today));

  const allVerses = [];
  CHAPTERS_RAW.forEach(ch => ch.sections.forEach(s => s.verses.forEach(v => allVerses.push(v.v))));

  if(dayIndex >= totalDays) return null; // 다듬기 기간

  const startIdx = Math.floor(dayIndex * TOTAL_VERSES / totalDays);
  const endIdx   = Math.min(TOTAL_VERSES, Math.floor((dayIndex + 1) * TOTAL_VERSES / totalDays));
  if(startIdx >= endIdx) return null;

  return {
    from: allVerses[startIdx],
    to:   allVerses[endIdx - 1],
    count: endIdx - startIdx,
    dayNum: dayIndex + 1,
    totalDays,
    perDay: (TOTAL_VERSES / totalDays).toFixed(1),
  };
}

// 에빙하우스 복습 대상 (1·3·7·14일 전 학습한 절)
function getStudyLog(){
  try{ return JSON.parse(store.get('gosi3_study_log') || '{}'); } catch(e){ return {}; }
}
function saveStudyLog(log){ store.set('gosi3_study_log', JSON.stringify(log)); }

function markVerseStudied(vref){
  const log = getStudyLog();
  const today = new Date(); today.setHours(0,0,0,0);
  const str = toInputDate(today);
  if(!log[vref]) log[vref] = [];
  if(!log[vref].includes(str)) log[vref].push(str);
  saveStudyLog(log);
}

function getReviewTargets(){
  const log = getStudyLog();
  const today = new Date(); today.setHours(0,0,0,0);
  const cycles = [1, 3, 7, 14];
  const targets = [];
  Object.keys(log).forEach(vref => {
    const firstDate = new Date(log[vref][0]);
    const elapsed = daysBetween(firstDate, today);
    if(cycles.includes(elapsed)) targets.push(vref);
  });
  return targets;
}

function renderDdayRoadmap(){
  const el = document.getElementById('dday-roadmap');
  if(!el) return;

  const today    = new Date(); today.setHours(0,0,0,0);
  const deadline = getMemorizeDeadline();
  const dDay     = daysBetween(today, GOSI_DATE);
  const dMemorize = daysBetween(today, deadline);

  let phaseHtml = '';

  // 오늘의 신규 진도
  const portion = getTodayPortion();
  let todayHtml = '';
  if(portion){
    todayHtml = `<div class="roadmap-card">
      <div class="roadmap-card-head">📖 오늘의 말씀 (${portion.dayNum}/${portion.totalDays}일차)</div>
      <div class="roadmap-row"><span class="lbl">오늘 외울 범위</span><span class="val">${portion.from} ~ ${portion.to}</span></div>
      <div class="roadmap-row"><span class="lbl">오늘 분량</span><span class="val">${portion.count}절</span></div>
      <div class="roadmap-row"><span class="lbl">하루 평균</span><span class="val">약 ${portion.perDay}절</span></div>
    </div>`;
  }

  // 오늘의 복습
  const reviewTargets = getReviewTargets();
  let reviewHtml = '';
  if(reviewTargets.length > 0){
    const chips = reviewTargets.map(v => `<span class="review-chip">${v}</span>`).join('');
    reviewHtml = `<div class="roadmap-card">
      <div class="roadmap-card-head">🔁 오늘의 복습 (에빙하우스)</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">1·3·7·14일 전 외운 절을 다시 떠올려보세요</div>
      <div class="review-chip-row">${chips}</div>
    </div>`;
  }

  // 전체 계획 카드
  const totalDays = Math.max(1, daysBetween(STUDY_START, deadline) + 1);
  const planHtml = `<div class="roadmap-card">
    <div class="roadmap-card-head">📅 학습 계획</div>
    <div class="roadmap-row">
      <span class="lbl">시작일</span>
      <input type="date" value="${toInputDate(STUDY_START)}" onchange="setStudyStart(this.value)"
        style="font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--accent-dark);font-weight:600;font-family:'Noto Sans KR',sans-serif;">
    </div>
    <div class="roadmap-row"><span class="lbl">전체 분량</span><span class="val">${TOTAL_VERSES}절 (13~17장)</span></div>
    <div class="roadmap-row"><span class="lbl">총 학습 기간</span><span class="val">${totalDays}일</span></div>
  </div>`;

  el.innerHTML = `
    ${phaseHtml}
    ${todayHtml}
    ${reviewHtml}
    ${planHtml}`;
}

renderDdayRoadmap();

  document.getElementById('lock-screen').style.display='none';
  document.getElementById('main-page').style.display='block';
