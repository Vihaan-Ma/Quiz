<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html{zoom:1.25;}</style>
<title>계시록 18~22장</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f4ef;--surface:#fff;--accent:#2d6a4f;--accent-light:#e8f5ee;--accent-dark:#1b4332;--warn:#b5451b;--warn-light:#fdf0eb;--gold:#c9a84c;--text:#1a1a1a;--text-muted:#6b6b6b;--border:#ddd8cf;--radius:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem 1rem 4rem;}
.page{max-width:700px;margin:0 auto;}

/* 비밀번호 화면 */
.lock-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;z-index:9999;padding:2.5rem 1.25rem 3rem;overflow-y:auto;}
.dday-wrap{max-width:380px;width:100%;margin:0 auto;}
.roadmap-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.roadmap-card-head{display:flex;align-items:center;gap:7px;margin-bottom:8px;font-size:13px;font-weight:700;color:var(--text);}
.roadmap-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-top:4px;}
.roadmap-row .lbl{color:var(--text-muted);}
.roadmap-row .val{font-weight:600;color:var(--accent-dark);}
.review-chip-row{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
.review-chip{font-size:11px;padding:3px 9px;border-radius:99px;background:var(--accent-light);color:var(--accent-dark);border:1px solid #95d5b2;}
.roadmap-row .lbl{color:var(--text-muted);}
.roadmap-row .val{font-weight:600;color:var(--accent-dark);}
.lock-screen h2{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--accent-dark);margin-bottom:6px;}
.lock-screen p{font-size:13px;color:var(--text-muted);margin-bottom:1.5rem;}
.lock-input{font-family:'Noto Sans KR',sans-serif;font-size:16px;padding:10px 16px;border:1px solid var(--border);border-radius:8px;width:220px;text-align:center;background:var(--surface);margin-bottom:8px;}
.lock-input:focus{outline:none;border-color:var(--accent);}
.lock-error{font-size:12px;color:var(--warn);margin-bottom:8px;height:16px;}

/* 헤더 */
.site-header{text-align:center;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);}
.site-header h1{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:600;}
.slogan{text-align:center;margin-top:.5rem;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:700;color:var(--warn);letter-spacing:.08em;}

/* 이름/카운터 */
.name-bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-bottom:1rem;}
.name-input:focus{outline:none;border-color:var(--accent);}

/* 탭 */
.tab-bar{display:flex;gap:4px;margin-bottom:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;}
.tab-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.tab-btn.active{background:var(--accent);color:#fff;}

/* 모드 */
.mode-bar{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:1rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px;}
.mode-btn{padding:8px 4px;border:none;background:transparent;border-radius:8px;font-family:'Noto Sans KR',sans-serif;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:background .15s,color .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mode-btn.active{background:var(--accent);color:#fff;}

/* 옵션 바 */
.options-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;font-size:13px;}
.options-bar label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--text-muted);}
.options-bar input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;}
.reset-btns{display:flex;gap:6px;margin-left:auto;}

/* 타이머 */
.timer-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;font-size:14px;}
.timer-num{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:600;color:var(--accent);}
.timer-num.warning{color:var(--warn);}
.timer-label{font-size:12px;color:var(--text-muted);}

/* 진행 */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.prog-track{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s;}
.prog-label{font-size:13px;color:var(--text-muted);white-space:nowrap;}
.score-pill{font-size:12px;padding:3px 10px;border-radius:99px;white-space:nowrap;}
.pill-study{background:var(--accent-light);color:var(--accent-dark);}
.pill-exam{background:#fff3cd;color:#7a5800;}

/* 도트 */
.q-jump{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem;}
.q-jump-row{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;}
.q-jump-row .q-jump{flex:1;margin-bottom:0;}
.blank-controls{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
.toggle-switch-wrap{display:flex;align-items:center;gap:6px;}
.toggle-switch-label{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.toggle-switch{position:relative;width:38px;height:22px;background:#ccc;border-radius:99px;cursor:pointer;transition:background .2s;flex-shrink:0;border:none;padding:0;touch-action:manipulation;}
.toggle-switch.on{background:var(--accent);}
.toggle-switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.toggle-switch.on .knob{left:18px;}
.shuffle-btn{font-size:12px;padding:5px 10px;white-space:nowrap;}
.q-dot{height:28px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:background .12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;white-space:nowrap;}
.q-dot:hover{background:var(--bg);}
.q-dot.done-correct{background:var(--accent);color:#fff;border-color:var(--accent);}
.q-dot.done-wrong{background:#f4a58a;color:#7a1f00;border-color:#f4a58a;}
.q-dot.done-exam{background:#ccc;color:#555;border-color:#ccc;}
.q-dot.current{border-color:var(--accent);border-width:2px;font-weight:700;}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.q-num{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--gold);display:block;margin-bottom:6px;}
.q-title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:600;color:var(--accent-dark);margin-bottom:4px;}
.q-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:1.25rem;}

/* 소단락 배너 */

/* 절 입력 */
.verse-item{margin-bottom:1.1rem;}
.verse-item:last-child{margin-bottom:0;}
.verse-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px;}
textarea{width:100%;font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.75;padding:9px 13px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);resize:vertical;min-height:52px;transition:border-color .2s;}
textarea:focus{outline:none;border-color:var(--accent);}

/* 버튼 */
.btn-row{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap;}
button{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;padding:7px 15px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
button:hover{background:var(--bg);}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
button.primary:hover{background:var(--accent-dark);}
button.danger{background:var(--warn-light);color:var(--warn);border-color:#f4a58a;}
button.sm{font-size:12px;padding:5px 11px;}

/* 피드백 */
.feedback{border-radius:8px;padding:9px 13px;font-size:13px;line-height:1.65;margin-top:7px;}
.feedback.correct{background:var(--accent-light);color:var(--accent-dark);border:1px solid #95d5b2;}
.feedback.wrong{background:var(--warn-light);color:var(--warn);border:1px solid #f4a58a;}
.answer-box{margin-top:7px;padding:9px 13px;background:#f9f8f5;border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:13px;line-height:1.75;}
.answer-box strong{color:var(--accent-dark);}
.diff-ok{color:var(--accent);}
.diff-bad{color:var(--warn);text-decoration:underline;}
.diff-box{display:inline-block;color:#e53935;border:1.5px solid #e53935;border-radius:3px;padding:0 1px;background:rgba(229,57,53,.06);line-height:1.4;}
.space-correction{display:inline-block;color:#e53935;font-size:0.65em;font-weight:900;vertical-align:super;line-height:1;margin:0;font-family:serif;}

/* 네비 */
.nav-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:.5rem;}
.nav-right{display:flex;gap:8px;margin-left:auto;}

/* 결과 */
.score-screen{padding:2rem 0;text-align:center;}
.score-circle{width:110px;height:110px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 1rem;}
.score-num{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:600;color:var(--accent);line-height:1;}
.score-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}
.score-msg{font-size:15px;color:var(--text-muted);margin-bottom:1.5rem;}
.stat-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
.stat-chip{font-size:12px;padding:3px 12px;border-radius:99px;border:1px solid var(--border);}
.score-btn-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:1.5rem;}
.wrong-list{text-align:left;margin-top:1rem;}
.wrong-list-title{font-size:13px;color:var(--text-muted);padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.wrong-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px;font-size:13px;line-height:1.75;}
.wrong-item .wq{color:var(--text-muted);font-size:12px;margin-bottom:3px;}
.wrong-item .wa{color:var(--accent-dark);font-weight:500;}

/* 오답 노트 */
.empty-note{text-align:center;padding:3rem 1rem;color:var(--text-muted);font-size:14px;}

/* 세레모니 */
#confetti-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
.perfect-overlay{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10000;pointer-events:none;}
.perfect-badge{background:linear-gradient(135deg,#2d6a4f,#52b788);color:#fff;border-radius:24px;padding:2rem 3rem;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25);animation:popIn .5s cubic-bezier(.175,.885,.32,1.275) forwards;}
@keyframes popIn{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}
.perfect-badge .trophy{font-size:56px;display:block;margin-bottom:8px;}
.perfect-badge .perfect-text{font-family:'Noto Serif KR',serif;font-size:28px;font-weight:600;margin-bottom:4px;}
.perfect-badge .perfect-sub{font-size:14px;opacity:.85;}

/* 모의고사 설정 화면 */
.exam-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.exam-setup h3{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--accent-dark);margin-bottom:10px;}
.exam-mode-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s;margin-bottom:8px;}
.exam-mode-card.selected{border-color:var(--accent);background:var(--accent-light);}
.exam-mode-card .title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:3px;}
.exam-mode-card .desc{font-size:12px;color:var(--text-muted);}
/* 빈칸채우기 모드 */
.blank-setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
.blank-setup h3{font-family:'Noto Serif KR',serif;font-size:16px;color:var(--accent-dark);margin-bottom:10px;}
.blank-chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem;}
.blank-chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:13px;cursor:pointer;touch-action:manipulation;}
.blank-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
.blank-sub-row{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.blank-sub-card{border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;touch-action:manipulation;transition:border-color .15s,background .15s;}
.blank-sub-card.selected{border-color:var(--accent);background:var(--accent-light);}
.blank-sub-card .title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:3px;}
.blank-sub-card .desc{font-size:12px;color:var(--text-muted);}
.blank-verse-block{margin-bottom:1.1rem;padding-bottom:1rem;border-bottom:1px dashed var(--border);}
.blank-verse-block:last-child{border-bottom:none;}
.blank-text{font-size:15px;line-height:2.1;color:var(--text);}
.blank-wrap{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 1px;}
.blank-answer-hint{font-size:10px;color:var(--warn);font-weight:700;line-height:1.3;margin-top:1px;white-space:nowrap;}
.blank-input{display:inline-block;min-width:48px;border:none;border-bottom:2px solid var(--accent);background:var(--accent-light);border-radius:4px 4px 0 0;padding:1px 6px;font-family:'Noto Sans KR',sans-serif;font-size:14px;text-align:center;color:var(--accent-dark);margin:0;}
.blank-input:focus{outline:none;background:#fff;}
.blank-input.bcorrect{background:var(--accent-light);border-color:var(--accent);color:var(--accent-dark);}
.blank-input.bwrong{background:var(--warn-light);border-color:var(--warn);color:var(--warn);text-decoration:line-through;}
.blank-fulltext{width:100%;min-height:140px;font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.85;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
</style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div class="lock-screen" id="lock-screen">
  <div class="dday-wrap">
    <h2 style="text-align:center;margin-bottom:4px">📖 계시록 18~22장</h2>
    <div id="dday-roadmap"></div>
    <p style="margin:1.25rem 0 1rem;text-align:center;font-size:13px;color:var(--text-muted)">엔터를 누르면 시작됩니다</p>
    <div style="text-align:center">
      <button class="primary" onclick="enterSite()" style="padding:12px 40px;font-size:16px">시작하기 →</button>
    </div>
  </div>
</div>

<canvas id="confetti-canvas" style="display:none"></canvas>
<div id="perfect-overlay" style="display:none" class="perfect-overlay">
  <div class="perfect-badge">
    <span class="trophy">🏆</span>
    <div class="perfect-text">완벽합니다!</div>
    
  </div>
</div>

<div class="page" id="main-page" style="display:none">
  <header class="site-header">
    <h1 style="font-size:20px;margin-top:4px">계시록 18~22장</h1>

  </header>

  <div class="name-bar">

  </div>

  <div class="tab-bar">
    <button class="tab-btn active" id="tab-btn-quiz" onclick="switchTab('quiz')">📖 퀴즈</button>
    <button class="tab-btn" id="tab-btn-wrong" onclick="switchTab('wrong')">📒 오답 노트</button>
  </div>

  <div id="tab-quiz">
    <div class="mode-bar">
      <button class="mode-btn active" id="btn-trace" onclick="setMode('trace')">✏️ 따라쓰기</button>
      <button class="mode-btn" id="btn-study" onclick="setMode('study')">📖 학습 모드</button>
      <button class="mode-btn" id="btn-blank" onclick="setMode('blank')">🧩 빈칸채우기</button>
      <button class="mode-btn" id="btn-exam" onclick="setMode('exam')">📝 모의고사</button>
    </div>
    <div class="options-bar" id="options-bar-main">
      <label><input type="checkbox" id="chk-space"> 띄어쓰기까지 정확히</label>
      <label><input type="checkbox" id="chk-random" onchange="applyOrder('random')"> 절 순서 무작위</label>
      <label><input type="checkbox" id="chk-reverse" onchange="applyOrder('reverse')"> 절 순서 거꾸로</label>
      <label><input type="checkbox" id="chk-perchapter" checked onchange="render()"> 장별 채점</label>
      <div class="reset-btns">
        <button class="sm danger" onclick="resetCurrent()">이 장 초기화</button>
        <button class="sm danger" onclick="resetAll()">전체 초기화</button>
      </div>
    </div>
    <div id="quiz-area"></div>
  </div>

  <div id="tab-wrong" style="display:none">
    <div id="wrong-area"></div>
  </div>

  
</div>

<script>
// ── 비밀번호 ──
function checkPwd(){
  const val=document.getElementById('lock-input').value;
  if(val==='vlftmdqlfflq!@'){
    document.getElementById('lock-screen').style.display='none';
    document.getElementById('main-page').style.display='block';
    loadUserData();
    render();
  } else {
    document.getElementById('lock-error').textContent='비밀번호가 틀렸습니다.';
    document.getElementById('lock-input').value='';
    document.getElementById('lock-input').focus();
  }
}

// ── 성구 데이터 ──
const CHAPTERS_RAW = [
  {
    id:1, ref:'계 18장', title:'요한계시록 18장',
    sections:[
      {label:'[1~4절] 바벨론의 무너짐', verses:[
        {v:'18:1', text:'이 일 후에 다른 천사가 하늘에서 내려오는 것을 보니 큰 권세를 가졌는데 그의 영광으로 땅이 환하여지더라'},
        {v:'18:2', text:'힘센 음성으로 외쳐 가로되 무너졌도다 무너졌도다 큰 성 바벨론이여 귀신의 처소와 각종 더러운 영의 모이는 곳과 각종 더럽고 가증한 새의 모이는 곳이 되었도다'},
        {v:'18:3', text:'그 음행의 진노의 포도주를 인하여 만국이 무너졌으며 또 땅의 왕들이 그로 더불어 음행하였으며 땅의 상고들도 그 사치의 세력을 인하여 치부하였도다 하더라'},
        {v:'18:4', text:'또 내가 들으니 하늘로서 다른 음성이 나서 가로되 내 백성아, 거기서 나와 그의 죄에 참예하지 말고 그의 받을 재앙들을 받지 말라'},
      ]},
      {label:'[5~10절] 하나님의 심판', verses:[

function vKey(ref){ return ref.replace(':','_'); }

function shuffleChapter(ch){
  // 장 전체 절을 모아 무작위로 섞고, 소단락 구분 없이 하나의 섹션으로 합침 (제목 표시 안 함)
  const allVerses=[];
  ch.sections.forEach(s=>s.verses.forEach(v=>allVerses.push(v)));
  const shuffled=[...allVerses].sort(()=>Math.random()-.5);
  return {...ch, sections:[{label:'', verses:shuffled}]};
}
function reverseChapter(ch){
  // 소단락 순서를 거꾸로, 각 소단락 내 절도 거꾸로
  const reversedSections=[...ch.sections].reverse().map(s=>({...s, verses:[...s.verses].reverse()}));
  return {...ch, sections:reversedSections};
}
function applyOrder(which){
  const randChk=document.getElementById('chk-random');
  const revChk=document.getElementById('chk-reverse');
  // 둘 중 하나만 체크되도록
  if(which==='random'&&randChk.checked) revChk.checked=false;
  if(which==='reverse'&&revChk.checked) randChk.checked=false;

  if(randChk.checked){
    CHAPTERS=CHAPTERS_RAW.map(ch=>shuffleChapter(ch));
  } else if(revChk.checked){
    CHAPTERS=CHAPTERS_RAW.map(ch=>reverseChapter(ch));
  } else {
    CHAPTERS=CHAPTERS_RAW.map(ch=>({...ch,sections:ch.sections.map(s=>({...s,verses:[...s.verses]}))}));
  }
  sAns={}; sChecked={}; sRevealed={}; eAns={}; eChecked={};
  traceAns={}; traceChecked={}; traceRevealed={};
  current=0;
  render();
}

// ── 정규화 ──
function normalizeSpecial(s){ return s.replace(/→|->|>/g,',').replace(/[·•・]/g,',').replace(/[、，]/g,','); }
function normStr(s,strict){
  let r=(s||'').trim();
  r=normalizeSpecial(r);
  r=r.replace(/\s*,\s*/g,',');
  if(!strict) r=r.replace(/\s+/g,'');
  else r=r.replace(/\s+/g,' ').trim();
  return r;
}
function isMatch(u,a){ const strict=document.getElementById('chk-space').checked; return normStr(u,strict)===normStr(a,strict); }
function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function diffHtml(user,ans){
  const uChars=(user||'').replace(/ /g,'').split('');
  const aChars=normStr(ans,false).split('');
  const m=uChars.length,n=aChars.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    if(normalizeSpecial(uChars[i-1])===aChars[j-1]) dp[i][j]=dp[i-1][j-1]+1;
    else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
  }
  const matched=new Array(m).fill(false);
  let i=m,j=n;
  while(i>0&&j>0){
    if(normalizeSpecial(uChars[i-1])===aChars[j-1]){matched[i-1]=true;i--;j--;}
    else if(dp[i-1][j]>dp[i][j-1]) i--;
    else j--;
  }
  const uRaw=user||'';
  let ci=0,h='';
  for(let k=0;k<uRaw.length;k++){
    const ch=uRaw[k];
    if(ch===' '){h+=escHtml(ch);continue;}
    if(matched[ci]) h+=`<span class="diff-ok">${escHtml(ch)}</span>`;
    else h+=`<span class="diff-bad">${escHtml(ch)}</span>`;
    ci++;
  }
  return h;
}

function diffHtmlBox(user,ans){
  // 비공백 글자 배열로 LCS 계산
  const uRaw=user||'', aRaw=ans||'';
  const uChars=uRaw.replace(/ /g,'').split('');       // 사용자 비공백
  const aCharsNorm=normStr(aRaw,false).split('');      // 정답 비공백(정규화)
  const aCharsOrig=aRaw.replace(/ /g,'').split('');   // 정답 비공백(원본 표시용)
  const m=uChars.length,n=aCharsNorm.length;

  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    if(normalizeSpecial(uChars[i-1])===aCharsNorm[j-1]) dp[i][j]=dp[i-1][j-1]+1;
    else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
  }
  const uMatched=new Array(m).fill(-1);
  const aMatched=new Array(n).fill(-1);
  let i=m,j=n;
  while(i>0&&j>0){
    if(normalizeSpecial(uChars[i-1])===aCharsNorm[j-1]){
      uMatched[i-1]=j-1; aMatched[j-1]=i-1; i--;j--;
    } else if(dp[i-1][j]>dp[i][j-1]) i--;
    else j--;
  }

  // 사용자 입력을 공백 포함 원본 기준으로 순회
  // 정답의 공백 위치 맵 (비공백 인덱스 기준)
  const aSpacesBefore={}; // aCharsOrig index i → 앞에 공백 있음
  let aci=0;
  for(let k=0;k<aRaw.length;k++){
    if(aRaw[k]===' '){ aSpacesBefore[aci]=true; }
    else { aci++; }
  }

  let result='';
  let ui=0, ai2=0;

  while(ui<m || ai2<n){
    if(ui<m && ai2<n && uMatched[ui]===ai2 && aMatched[ai2]===ui){
      // 매칭: 정답 공백 먼저 표시 후 글자
      if(aSpacesBefore[ai2]) result+=' ';
      result+=escHtml(uChars[ui]);
      ui++; ai2++;
    } else if(ui<m && uMatched[ui]===-1){
      // 잘못 입력한 글자 → 빨간 박스
      result+=`<span class="diff-box">${escHtml(uChars[ui])}</span>`;
      ui++;
    } else if(ai2<n && aMatched[ai2]===-1){
      // 누락된 글자 → 빨간색 삽입 (정답 공백 포함)
      if(aSpacesBefore[ai2]) result+=' ';
      result+=`<span style="color:#e53935;font-weight:600">${escHtml(aCharsOrig[ai2])}</span>`;
      ai2++;
    } else {
      if(ui<m){ result+=`<span class="diff-box">${escHtml(uChars[ui])}</span>`; ui++; }
      else if(ai2<n){
        if(aSpacesBefore[ai2]) result+=' ';
        result+=`<span style="color:#e53935;font-weight:600">${escHtml(aCharsOrig[ai2])}</span>`;
        ai2++;
      }
    }
  }
  return result;
}

function spaceCorrection(user,ans){
  const uRaw=user||'', aRaw=ans||'';
  const aSpaces={};
  let ci=0;
  for(let i=0;i<aRaw.length;i++){
    if(aRaw[i]===' ') aSpaces[ci]=true;
    else ci++;
  }
  let h='',charIdx=0;
  for(let i=0;i<uRaw.length;i++){
    const ch=uRaw[i];
    if(ch===' '){
      if(aSpaces[charIdx]) h+=' ';
      else h+=`<span class="space-correction">⌒</span>`;
    } else {
      const prevIsSpace=(i>0&&uRaw[i-1]===' ');
      if(aSpaces[charIdx]&&!prevIsSpace) h+=`<span class="space-correction">∨</span>`;
      h+=escHtml(ch);
      charIdx++;
    }
  }
  return h;
}

function calcHeight(text){
  const len=text.length;
  if(len>200) return '160px';
  if(len>120) return '110px';
  if(len>60) return '80px';
  return '52px';
}

function scrollToEl(id){
  setTimeout(()=>{
    const el=document.getElementById(id);
    if(!el) return;
    const rect=el.getBoundingClientRect();
    // 입력칸이 화면 중앙에 오도록
    const viewH=window.innerHeight;
    const offset=window.scrollY+rect.top-(viewH/2 - rect.height/2);
    window.scrollTo({top:Math.max(0,offset),behavior:'smooth'});
  },60);
}

  if(mode==='study'){

      const k=vKey(v.v); sAns[k]=''; sChecked[k]=false; sRevealed[k]=false;
    }));
  } else if(mode==='trace'){
    ch.sections.forEach(s=>s.verses.forEach(v=>{
      const k=vKey(v.v); traceAns[k]=''; traceChecked[k]=false; traceRevealed[k]=false;
    }));
  } else {
    ch.sections.forEach(s=>s.verses.forEach(v=>{ eAns[vKey(v.v)]=''; }));
  }
  render();
}
function resetAll(){
  if(!confirm('모든 장의 답을 초기화할까요?')) return;
  sAns={}; sChecked={}; sRevealed={}; eAns={}; eChecked={};
  current=0; render();
}

// ── 카운트 ──
function countCorrectStudy(){
  let c=0;
  CHAPTERS.forEach(ch=>ch.sections.forEach(s=>s.verses.forEach(v=>{
    const k=vKey(v.v); if(sChecked[k]&&isMatch(sAns[k]||'',v.text)) c++;
  })));
  return c;
}
function totalVerses(){ return CHAPTERS.reduce((s,ch)=>s+ch.sections.reduce((s2,sec)=>s2+sec.verses.length,0),0); }

// ── Render ──
function render(){
  if(mode==='study') renderStudy();
  else if(mode==='trace') renderTrace();
  else if(mode==='blank') renderBlank();
  else if(mode==='exam'){
    if(EXAM_MODE_STATE.step==='setup') renderExamSetup();
    else if(EXAM_MODE_STATE.step==='bundle') renderBundleExam();
    else renderExam(); // classic
  }
}

// ── 학습 모드 ──
function renderStudy(){
  const app=document.getElementById('quiz-area');
  const ch=CHAPTERS[current];
  const total=CHAPTERS.length;
  const pct=Math.round(current/total*100);

  let dotsHtml='<div class="q-jump">';
  CHAPTERS.forEach((c,ci)=>{
    const allC=c.sections.every(s=>s.verses.every(v=>sChecked[vKey(v.v)]));
    const allOk=allC&&c.sections.every(s=>s.verses.every(v=>isMatch(sAns[vKey(v.v)]||'',v.text)));
    let cls='q-dot'+(ci===current?' current':'');
    if(allC) cls+=allOk?' done-correct':' done-wrong';
    dotsHtml+=`<button class="${cls}" onclick="go(${ci})">${c.ref.replace('계 ','').replace('장','')+'장'}</button>`;
  });
  dotsHtml+='</div>';

  // 첫 미채점 절 찾기
  let firstUncheckedKey=null;
  for(const sec of ch.sections){
    for(const v of sec.verses){
      if(!sChecked[vKey(v.v)]){firstUncheckedKey='ta_'+vKey(v.v);break;}
    }
    if(firstUncheckedKey) break;
  }

  let versesContent='';
  ch.sections.forEach(sec=>{

    sec.verses.forEach(v=>{
      const k=vKey(v.v);
      const ua=sAns[k]||'', isChecked=sChecked[k], isRevealed=sRevealed[k];
      const isCorrect=isChecked&&isMatch(ua,v.text);
      let feedHtml='';
      if(isChecked){
        if(isCorrect){
          const strict=document.getElementById('chk-space').checked;
          const hasSpaceDiff=!strict&&ua.replace(/\s/g,'')===v.text.replace(/\s/g,'')&&ua!==v.text;
          feedHtml=hasSpaceDiff
            ?`<div class="feedback correct">✓ 맞았어요! (띄어쓰기 교정)<br><span style="font-size:12px">내 답: ${spaceCorrection(ua,v.text)}</span></div>`
            :`<div class="feedback correct">✓ 정확히 맞았어요!</div>`;
        } else {
          const u=normStr(ua,false),a=normStr(v.text,false);
          const match=[...u].filter((c,i)=>c===a[i]).length;
          const pct2=a.length>0?Math.round(match/a.length*100):0;
          feedHtml=`<div class="feedback wrong"><div style="margin-bottom:4px">틀렸어요 (${pct2}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(ua,v.text)}</div></div>`;
          if(isRevealed) feedHtml+=`<div class="answer-box"><strong>정답:</strong> ${escHtml(v.text)}</div>`;
        }
      }
      const btnHtml=isChecked
        ?`<div class="btn-row">${!isRevealed&&!isCorrect?`<button onclick="sReveal('${k}')">정답 보기</button>`:''}<button onclick="sRetry('${k}')">다시 쓰기</button></div>`
        :`<div class="btn-row"><button class="primary" onclick="sCheck('${k}','${v.v}')">확인</button></div>`;
      versesContent+=`<div class="verse-item"><div class="verse-label">${v.v}</div><textarea id="ta_${k}" style="min-height:${calcHeight(v.text)}">${escHtml(ua)}</textarea>${feedHtml}${btnHtml}</div>`;
    });
  });

  const allChecked=ch.sections.every(s=>s.verses.every(v=>sChecked[vKey(v.v)]));
  const isLast=current===CHAPTERS.length-1;
  const allDone=CHAPTERS.every(c=>c.sections.every(s=>s.verses.every(v=>sChecked[vKey(v.v)])));
  let navHtml='';
  if(allChecked){
    navHtml=`<div class="nav-row">
      ${current>0?`<button onclick="go(${current-1})">← 이전</button>`:'<span></span>'}
      <div class="nav-right">
        ${!isLast?`<button class="primary" onclick="go(${current+1})">다음 →</button>`:''}
        ${isLast||allDone?`<button class="primary" onclick="showStudyScore()">결과 보기 →</button>`:''}
      </div>
    </div>`;
  }

  app.innerHTML=`
    <div class="progress-row">
      <span class="prog-label">${current+1} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="score-pill pill-study">맞은 절 ${countCorrectStudy()}개</span>
    </div>
    ${dotsHtml}
    <div class="card">
      <span class="q-num">성구 ${ch.id}</span>
      <div class="q-title">${ch.ref}</div>
      <div class="q-subtitle">${ch.title}</div>
      ${versesContent}
    </div>
    ${navHtml}`;

  // 엔터 바인딩
  CHAPTERS[current].sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    const ta=document.getElementById('ta_'+k);
    if(!ta) return;
    bindStudyEnter(ta, k, v.v);
  }));

  if(firstUncheckedKey){
    // 첫 장 첫 절이 아니면 스크롤
    const isFirstVerseOfFirst = (current===0 && firstUncheckedKey==='ta_'+vKey(CHAPTERS[0].sections[0].verses[0].v));
    if(!isFirstVerseOfFirst) scrollToEl(firstUncheckedKey);
    setTimeout(()=>{ const ta=document.getElementById(firstUncheckedKey); if(ta) ta.focus(); },80);
  }
}

function bindStudyEnter(ta, k, vref){
  ta.onkeydown=function(e){
    if(e.key!=='Enter'||e.shiftKey) return;
    if(e.isComposing||e.keyCode===229) return; // 한글 IME 조합 중 엔터 무시
    e.preventDefault();
    if(!sChecked[k]){
      // 미채점 → 채점
      sCheck(k, vref);
    } else {
      // 틀린 상태 → 입력칸 비우고 다시 입력 대기
      sChecked[k]=false;
      sAns[k]='';
      ta.value='';
      ta.readOnly=false;
      const oldFeed=document.getElementById('feed_'+k);
      if(oldFeed) oldFeed.remove();
      // 입력칸이 화면 중앙에 오도록 스크롤
      const rect=ta.getBoundingClientRect();
      const viewH=window.innerHeight;
      const offset=window.scrollY+rect.top-(viewH/2-rect.height/2);
      window.scrollTo({top:Math.max(0,offset),behavior:'smooth'});
      setTimeout(()=>{ ta.focus(); },60);
      // 다시 엔터 바인딩
      bindStudyEnter(ta, k, vref);
    }
  };
}

function sCheck(k, vref){
  const ta=document.getElementById('ta_'+k);
  sAns[k]=ta?ta.value:(sAns[k]||'');
  sChecked[k]=true;
  let ans='';
  for(const ch of CHAPTERS) for(const sec of ch.sections) for(const v of sec.verses){ if(vKey(v.v)===k){ans=v.text;break;} }
  const correct=isMatch(sAns[k],ans);
  if(!correct){ wrongNote[k]={vref,answer:ans,ua:sAns[k]}; }
  else { delete wrongNote[k]; }

  if(correct){
    // 맞음: 에빙하우스 학습 기록 저장 후 다음 절로
    markVerseStudied(vref);
    render();
    sMoveNext(k);
  } else {
    // 틀림: render 하지 않고 피드백만 현재 위치에 삽입, 포커스 유지
    const u=normStr(sAns[k],false), a=normStr(ans,false);
    const match=[...u].filter((c,i)=>c===a[i]).length;
    const pct2=a.length>0?Math.round(match/a.length*100):0;
    const feedHtml=`<div class="feedback wrong" id="feed_${k}"><div style="margin-bottom:4px">틀렸어요 (${pct2}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(sAns[k],ans)}</div></div>`;
    // 기존 피드백 제거 후 삽입
    const oldFeed=document.getElementById('feed_'+k);
    if(oldFeed) oldFeed.remove();
    if(ta){
      ta.insertAdjacentHTML('afterend', feedHtml);
      ta.readOnly=false;
      ta.focus();
      // 틀린 상태에서 엔터 → 입력칸 초기화 후 재입력
      bindStudyEnter(ta, k, vref);
    }
  }
}
function sReveal(k){ sRevealed[k]=true; render(); }
function sRetry(k){
  sChecked[k]=false; sRevealed[k]=false; sAns[k]='';
  render();
  setTimeout(()=>{ const ta=document.getElementById('ta_'+k); if(ta){ta.value='';ta.focus();} },30);
}
function sMoveNext(k){
  // 현재 장의 다음 미채점 절 찾기
  const ch=CHAPTERS[current];
  let found=false, nextKey=null;
  let passedCurrent=false;
  for(const sec of ch.sections){
    for(const v of sec.verses){
      const vk=vKey(v.v);
      if(vk===k){passedCurrent=true;continue;}
      if(passedCurrent&&!sChecked[vk]){nextKey='ta_'+vk;break;}
    }
    if(nextKey) break;
  }
  if(nextKey){
    scrollToEl(nextKey);
    setTimeout(()=>{ const ta=document.getElementById(nextKey); if(ta){ta.focus();ta.select();} },80);
  } else {
    // 마지막 절 — 포커스 유지, 엔터로 다음 장
    setTimeout(()=>{
      const ta=document.getElementById('ta_'+k);
      if(ta){
        ta.focus();
        ta.onkeydown=function(e){
          if(e.key!=='Enter'||e.shiftKey) return;
          if(e.isComposing||e.keyCode===229) return;
          e.preventDefault();
          if(current<CHAPTERS.length-1) go(current+1); else showStudyScore();
        };
      }
    },30);
  }
}

// ── 모의고사 설정 화면 ──
function renderExamSetup(){
  const app=document.getElementById('quiz-area');
  const sel=EXAM_MODE_STATE.selectedChapters;
  const chapterChips=CHAPTERS_RAW.map((ch,ci)=>{
    const label=ch.ref.replace('계 ','').replace('장','')+'장';
    const isSel=sel.includes(ci);
    return `<button class="blank-chip${isSel?' selected':''}" onclick="toggleExamChapter(${ci})">${label}</button>`;
  }).join('');

  const modes=[
    {key:'classic', title:'📋 기존 모의고사', desc:'전체 장을 순서대로 풀고 90분 타이머로 채점'},
    {key:'bundle', title:'🎲 묶음 모드', desc:'선택한 장에서 2~3절씩 무작위로 묶어 출제'},
  ];
  const modeCards=modes.map(m=>{
    const isSel=EXAM_MODE_STATE.selectedMode===m.key;
    return `<div class="exam-mode-card${isSel?' selected':''}" onclick="selectExamMode('${m.key}')">
      <div class="title">${m.title}</div>
      <div class="desc">${m.desc}</div>
    </div>`;
  }).join('');

  const isBundle=(EXAM_MODE_STATE.selectedMode==='bundle');
  const gradeOpts=isBundle?`
    <h3>③ 채점 방식</h3>
    <div class="blank-chip-row">
      <button class="blank-chip${EXAM_MODE_STATE.gradeMode==='bundle'?' selected':''}" onclick="EXAM_MODE_STATE.gradeMode='bundle';render()">묶음별 채점</button>
      <button class="blank-chip${EXAM_MODE_STATE.gradeMode==='all'?' selected':''}" onclick="EXAM_MODE_STATE.gradeMode='all';render()">전체 채점</button>
    </div>`:'';

  const canStart=isBundle?(sel.length>0):true;

  app.innerHTML=`
    <div class="exam-setup">
      <h3>① 출제 방식 선택</h3>
      ${modeCards}
      ${isBundle?`<h3>② 장 선택 (복수 선택 가능)</h3>
      <div class="blank-chip-row">${chapterChips}</div>`:''}
      ${gradeOpts}
      <button class="primary" style="width:100%;margin-top:1rem" ${!canStart?'disabled':''}  onclick="startSelectedExamMode()">시험 시작</button>
    </div>`;
}

function toggleExamChapter(ci){
  const idx=EXAM_MODE_STATE.selectedChapters.indexOf(ci);
  if(idx>=0) EXAM_MODE_STATE.selectedChapters.splice(idx,1);
  else EXAM_MODE_STATE.selectedChapters.push(ci);
  render();
}

function selectExamMode(key){
  EXAM_MODE_STATE.selectedMode=key;
  render();
}

function startSelectedExamMode(){
  if(EXAM_MODE_STATE.selectedMode==='bundle'){
    // 묶음 모드: 각 장 안에서 2~3절씩 순서대로 묶음 생성 → 묶음 전체를 무작위 섞기
    const allBundles=[];
    EXAM_MODE_STATE.selectedChapters.forEach(ci=>{
      const ch=CHAPTERS_RAW[ci];
      const verses=[];
      ch.sections.forEach(s=>s.verses.forEach(v=>verses.push({v:v.v,text:v.text,chRef:ch.ref})));
      // 장 내에서 2~3절씩 순서대로 묶음 구성
      let i=0;
      while(i<verses.length){
        const size=Math.min(2+Math.floor(Math.random()*2), verses.length-i); // 2~3절
        allBundles.push({ verses:verses.slice(i,i+size), checked:false, answers:{}, correctCount:0, totalCount:0 });
        i+=size;
      }
    });
    // 묶음 전체를 무작위 순서로 섞기
    for(let i=allBundles.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [allBundles[i],allBundles[j]]=[allBundles[j],allBundles[i]]; }
    EXAM_MODE_STATE.bundles=allBundles;
    EXAM_MODE_STATE.bundleIdx=0;
    EXAM_MODE_STATE.step='bundle';
    render();
  } else {
    // 기존 모의고사 — 바로 시작
    examStarted=true;
    timerSec=90*60;
    startTimer();
    EXAM_MODE_STATE.step='classic';
    current=0;
    render();
  }
}

// ── 묶음 모의고사 렌더링 ──
function renderBundleExam(){
  const app=document.getElementById('quiz-area');
  const bundles=EXAM_MODE_STATE.bundles;
  const bi=EXAM_MODE_STATE.bundleIdx;
  const bundle=bundles[bi];
  const total=bundles.length;
  const isGradeAll=EXAM_MODE_STATE.gradeMode==='all';
  const allSubmitted=bundles.every(b=>b.checked);

  // 도트 라인
  let dotsHtml='<div class="q-jump">';
  bundles.forEach((b,i)=>{
    let cls='q-dot'+(i===bi?' current':'');
    if(b.checked) cls+=b.allCorrect?' done-correct':' done-wrong';
    dotsHtml+=`<button class="${cls}" onclick="goBundleExam(${i})">${i+1}</button>`;
  });
  dotsHtml+='</div>';

  // 절 내용
  let versesHtml='';
  bundle.verses.forEach(v=>{
    const k='be_'+vKey(v.v);
    const ua=bundle.answers[k]||'';
    let feedHtml='';
    if(bundle.checked){
      const ok=isMatch(ua,v.text);
      if(ok){ feedHtml=`<div class="feedback correct">✓ 맞았어요!</div>`; }
      else {
        const u=normStr(ua,false),a=normStr(v.text,false);
        const mt=[...u].filter((c,i)=>c===a[i]).length;
        const pct=a.length>0?Math.round(mt/a.length*100):0;
        feedHtml=`<div class="feedback wrong"><div style="margin-bottom:4px">틀렸어요 (${pct}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(ua,v.text)}</div></div><div class="answer-box"><strong>정답:</strong> ${escHtml(v.text)}</div>`;
      }
    }
    versesHtml+=`<div class="verse-item">
      <div class="verse-label">${v.v} <span style="font-size:10px;color:var(--text-muted)">${escHtml(v.chRef)}</span></div>
      <textarea id="ta_be_${vKey(v.v)}" style="min-height:${calcHeight(v.text)}" ${bundle.checked?'readonly':''}>${escHtml(ua)}</textarea>
      ${feedHtml}
    </div>`;
  });

  // 액션
  let actionHtml='';
  if(!isGradeAll){
    if(!bundle.checked){
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button class="primary" onclick="submitBundleItem(${bi})">이 묶음 제출</button>
      </div>`;
    } else {
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button onclick="retryBundleItem(${bi})">다시 쓰기</button>
        ${allSubmitted?`<button class="primary" onclick="showBundleExamScore()">전체 결과 보기 →</button>`:''}
      </div>`;
    }
  } else {
    // 전체 채점 모드
    if(!allSubmitted){
      const isLast=bi===total-1;
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        ${isLast?`<button class="primary" onclick="submitAllBundleExam()">전체 제출 및 결과 보기</button>`:''}
      </div>`;
    } else {
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button class="primary" onclick="showBundleExamScore()">결과 보기 →</button>
      </div>`;
    }
  }

  const navHtml=`<div class="nav-row">
    ${bi>0?`<button onclick="goBundleExam(${bi-1})">← 이전</button>`:'<span></span>'}
    <div class="nav-right">
      ${bi<total-1?`<button class="primary" onclick="goBundleExam(${bi+1})">다음 →</button>`:''}
    </div>
  </div>`;

  const correct=bundles.reduce((s,b)=>s+b.correctCount,0);
  const totalV=bundles.reduce((s,b)=>s+b.verses.length,0);
  const checked=bundles.filter(b=>b.checked).length;

  app.innerHTML=`
    <div class="progress-row">
      <span class="prog-label">${bi+1} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${Math.round(bi/total*100)}%"></div></div>
      <span class="score-pill pill-exam">${allSubmitted?`${correct}/${totalV}절`:`${checked}/${total}묶음 완료`}</span>
    </div>
    ${dotsHtml}
    <div class="card">
      <span class="q-num">묶음 ${bi+1}</span>
      <div class="q-subtitle" style="font-size:12px;color:var(--text-muted);margin-bottom:1rem">${bundle.verses.map(v=>v.v).join(', ')}</div>
      ${versesHtml}
      ${actionHtml}
    </div>
    ${navHtml}
    <div class="btn-row" style="margin-top:.5rem">
      <button class="sm" onclick="restartExam()">⚙️ 설정으로 돌아가기</button>
    </div>`;

  // 입력 저장 + 엔터로 다음 textarea, 마지막 절에서 엔터 → 제출
  if(!bundle.checked){
    const textareas=Array.from(app.querySelectorAll('textarea'));
    textareas.forEach((ta,ti)=>{
      const vref=bundle.verses[ti]?.v;
      if(!vref) return;
      const k='be_'+vKey(vref);
      ta.oninput=()=>{ bundle.answers[k]=ta.value; };
      ta.onkeydown=function(e){
        if(e.key!=='Enter'||e.shiftKey) return;
        if(e.isComposing||e.keyCode===229) return;
        e.preventDefault();
        bundle.answers[k]=ta.value;
        if(ti+1<textareas.length){
          const nt=textareas[ti+1]; nt.focus();
          const rect=nt.getBoundingClientRect();
          const offset=window.scrollY+rect.top-(window.innerHeight/2-rect.height/2);
          window.scrollTo({top:Math.max(0,offset),behavior:'smooth'});
        } else {
          // 마지막 절 → 제출
          submitBundleItem(EXAM_MODE_STATE.bundleIdx);
        }
      };
    });
    if(textareas.length>0){ setTimeout(()=>{ textareas[0].focus(); },80); }
  }
}

function goBundleExam(idx){
  // 이동 전 현재 입력값 저장
  const bundle=EXAM_MODE_STATE.bundles[EXAM_MODE_STATE.bundleIdx];
  if(!bundle.checked){
    bundle.verses.forEach(v=>{
      const ta=document.getElementById('ta_be_'+vKey(v.v));
      if(ta) bundle.answers['be_'+vKey(v.v)]=ta.value;
    });
  }
  EXAM_MODE_STATE.bundleIdx=idx;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function submitBundleItem(bi){
  const bundle=EXAM_MODE_STATE.bundles[bi];
  // 저장
  bundle.verses.forEach(v=>{
    const ta=document.getElementById('ta_be_'+vKey(v.v));
    if(ta) bundle.answers['be_'+vKey(v.v)]=ta.value;
  });
  // 채점
  let correct=0;
  bundle.verses.forEach(v=>{
    const ua=bundle.answers['be_'+vKey(v.v)]||'';
    if(isMatch(ua,v.text)) correct++;
  });
  bundle.checked=true;
  bundle.allCorrect=(correct===bundle.verses.length);
  bundle.correctCount=correct;
  bundle.totalCount=bundle.verses.length;
  if(bundle.allCorrect){ setTimeout(showPerfect,400); }
  render();
}

function retryBundleItem(bi){
  const bundle=EXAM_MODE_STATE.bundles[bi];
  bundle.checked=false; bundle.allCorrect=false; bundle.correctCount=0; bundle.totalCount=0;
  bundle.answers={};
  render();
}

function submitAllBundleExam(){
  // 현재 페이지 입력 저장
  const bundle=EXAM_MODE_STATE.bundles[EXAM_MODE_STATE.bundleIdx];
  bundle.verses.forEach(v=>{
    const ta=document.getElementById('ta_be_'+vKey(v.v));
    if(ta) bundle.answers['be_'+vKey(v.v)]=ta.value;
  });
  // 전체 채점
  EXAM_MODE_STATE.bundles.forEach(b=>{
    let correct=0;
    b.verses.forEach(v=>{ if(isMatch(b.answers['be_'+vKey(v.v)]||'',v.text)) correct++; });
    b.checked=true; b.allCorrect=(correct===b.verses.length); b.correctCount=correct; b.totalCount=b.verses.length;
  });
  showBundleExamScore();
}

function showBundleExamScore(){
  const bundles=EXAM_MODE_STATE.bundles;
  const totalV=bundles.reduce((s,b)=>s+b.verses.length,0);
  const correct=bundles.reduce((s,b)=>s+b.correctCount,0);
  const pct=Math.round(correct/totalV*100);
  const msg=pct===100?'완벽합니다!':pct>=80?'아주 잘 하셨어요!':pct>=60?'조금만 더 연습해 봐요!':'반복 학습해 보세요.';
  if(pct===100){ setTimeout(showPerfect,400); }
  const wrong=bundles.flatMap(b=>b.verses.filter(v=>!isMatch(b.answers['be_'+vKey(v.v)]||'',v.text)).map(v=>({vref:v.v,answer:v.text,ua:b.answers['be_'+vKey(v.v)]||''})));
  const wHtml=wrong.map(w=>`<div class="wrong-item"><div class="wq">${escHtml(w.vref)}</div><div class="wa">정답: ${escHtml(w.answer)}</div>${w.ua?`<div style="font-size:12px;margin-top:4px">내 답: ${diffHtmlBox(w.ua,w.answer)}</div>`:''}</div>`).join('');
  document.getElementById('quiz-area').innerHTML=`<div class="score-screen">
    <div class="score-circle"><div class="score-num">${pct}%</div><div class="score-sub">${correct}/${totalV}절</div></div>
    <div class="score-msg">${msg}</div>
    <div class="stat-row">
      <span class="stat-chip" style="background:var(--accent-light);color:var(--accent-dark)">정답 ${correct}절</span>
      <span class="stat-chip" style="background:var(--warn-light);color:var(--warn)">오답 ${totalV-correct}절</span>
    </div>
    <div class="score-btn-row">
      <button onclick="restartExam()">다시 설정하기</button>
      <button onclick="switchTab('wrong')">오답 노트 →</button>
    </div>
    ${wrong.length?`<div class="wrong-list"><div class="wrong-list-title">틀린 절 (${wrong.length}개)</div>${wHtml}</div>`:''}
  </div>`;
}

function renderExam(){
  const app=document.getElementById('quiz-area');
  const ch=CHAPTERS[current];
  const total=CHAPTERS.length;
  const pct=Math.round(current/total*100);
  const perChapter=document.getElementById('chk-perchapter')?.checked;
  const finalSubmitted=!!eChecked['final'];
  // 현재 장이 "제출됨" 상태인지 (장별 모드: eChecked[ch.id], 전체 모드: final)
  const chapterSubmitted = perChapter ? !!eChecked['ch_'+ch.id] : finalSubmitted;
  const isLast=current===CHAPTERS.length-1;

  // 타이머
  const m2=Math.floor(timerSec/60), s2=timerSec%60;
  const timerHtml=`<div class="timer-bar">
    <div><div class="timer-label">남은 시간</div><div class="timer-num${timerSec<=300?' warning':''}" id="exam-timer">${String(m2).padStart(2,'0')}:${String(s2).padStart(2,'0')}</div></div>
    <div style="font-size:12px;color:var(--text-muted)">모의고사 모드${perChapter?' (장별 채점)':''}</div>
  </div>`;

  let dotsHtml='<div class="q-jump">';
  CHAPTERS.forEach((c,ci)=>{
    const hasInput=c.sections.some(s=>s.verses.some(v=>(eAns[vKey(v.v)]||'').trim()!==''));
    let cls='q-dot'+(ci===current?' current':'');
    const cSubmitted = perChapter ? !!eChecked['ch_'+c.id] : finalSubmitted;
    if(cSubmitted){
      const allOk=c.sections.every(s=>s.verses.every(v=>isMatch(eAns[vKey(v.v)]||'',v.text)));
      cls+=allOk?' done-correct':' done-wrong';
    } else if(hasInput) cls+=' done-exam';
    dotsHtml+=`<button class="${cls}" onclick="go(${ci})">${c.ref.replace('계 ','').replace('장','')+'장'}</button>`;
  });
  dotsHtml+='</div>';

  let versesContent='';
  ch.sections.forEach(sec=>{
    sec.verses.forEach(v=>{
      const k=vKey(v.v);
      const ua=eAns[k]||'';
      let feedHtml='';
      if(chapterSubmitted){
        const correct=isMatch(ua,v.text);
        if(correct){
          feedHtml=`<div class="feedback correct">✓ 맞았어요!</div>`;
        } else {
          const u=normStr(ua,false),a=normStr(v.text,false);
          const match=[...u].filter((c,i)=>c===a[i]).length;
          const pct2=a.length>0?Math.round(match/a.length*100):0;
          feedHtml=`<div class="feedback wrong"><div style="margin-bottom:4px">틀렸어요 (${pct2}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(ua,v.text)}</div></div><div class="answer-box"><strong>정답:</strong> ${escHtml(v.text)}</div>`;
        }
      }
      versesContent+=`<div class="verse-item"><div class="verse-label">${v.v}</div><textarea id="ta_e_${k}" style="min-height:${calcHeight(v.text)}" ${chapterSubmitted?'readonly':''}>${escHtml(ua)}</textarea>${feedHtml}</div>`;
    });
  });

  const allFilled=CHAPTERS.every(c=>c.sections.every(s=>s.verses.every(v=>(eAns[vKey(v.v)]||'').trim()!=='')));
  const chapterFilled=ch.sections.every(s=>s.verses.every(v=>(eAns[vKey(v.v)]||'').trim()!==''));
  const allChaptersSubmitted=CHAPTERS.every(c=>!!eChecked['ch_'+c.id]);

  let actionHtml='';
  if(perChapter){
    if(!chapterSubmitted){
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button id="btn-submit-chapter" class="primary" onclick="eSubmitChapter(${current})" ${!chapterFilled?'disabled style="opacity:.5"':''}>이 장 제출</button>
      </div>
      <div id="hint-submit" style="font-size:12px;color:var(--text-muted);margin-top:6px;display:${chapterFilled?'none':'block'}">이 장의 모든 절을 작성해야 제출할 수 있어요.</div>`;
    } else {
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button onclick="eRetryChapter(${current})">이 장 다시 풀기</button>
        ${allChaptersSubmitted?`<button class="primary" onclick="showExamScore()">전체 결과 보기 →</button>`:''}
      </div>`;
    }
  } else {
    if(!finalSubmitted&&isLast){
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button id="btn-submit-all" class="primary" onclick="eSubmitAll()" ${!allFilled?'disabled style="opacity:.5"':''}>최종 제출 및 결과 보기</button>
      </div>
      <div id="hint-submit" style="font-size:12px;color:var(--text-muted);margin-top:6px;display:${allFilled?'none':'block'}">모든 장의 모든 절을 작성해야 제출할 수 있어요.</div>`;
    } else if(finalSubmitted){
      actionHtml=`<div class="btn-row" style="margin-top:1rem">
        <button class="primary" onclick="showExamScore()">결과 보기 →</button>
        <button onclick="restartExam()">처음부터 다시</button>
      </div>`;
    }
  }

  const filledCount=CHAPTERS.reduce((s,c)=>s+c.sections.reduce((s2,sec)=>s2+sec.verses.filter(v=>(eAns[vKey(v.v)]||'').trim()!=='').length,0),0);
  const tv=totalVerses();
  const pillText = perChapter
    ? (chapterSubmitted?'이 장 채점 완료':'작성 '+filledCount+'/'+tv+'절')
    : (finalSubmitted?'채점 완료':'작성 '+filledCount+'/'+tv+'절');

  const navHtml=`<div class="nav-row">
    ${current>0?`<button onclick="go(${current-1})">← 이전</button>`:'<span></span>'}
    ${!isLast?`<div class="nav-right"><button class="primary" onclick="go(${current+1})">다음 →</button></div>`:''}
  </div>`;

  app.innerHTML=`
    ${timerHtml}
    <div class="progress-row">
      <span class="prog-label">${current+1} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="score-pill pill-exam">${pillText}</span>
    </div>
    ${dotsHtml}
    <div class="card">
      <span class="q-num">성구 ${ch.id}</span>
      <div class="q-title">${ch.ref}</div>
      <div class="q-subtitle">${ch.title}</div>
      ${versesContent}
      ${actionHtml}
    </div>
    ${navHtml}`;

  if(!chapterSubmitted){
    // 엔터: 다음 절/장 이동 + oninput 저장
    let allVerses=[];
    ch.sections.forEach(sec=>sec.verses.forEach(v=>allVerses.push(v)));
    allVerses.forEach((v,vi)=>{
      const k=vKey(v.v);
      const ta=document.getElementById('ta_e_'+k);
      if(!ta) return;
      ta.oninput=function(){
        eAns[k]=ta.value;
        if(perChapter){
          const cf=ch.sections.every(s=>s.verses.every(v2=>(eAns[vKey(v2.v)]||'').trim()!==''));
          const btn=document.getElementById('btn-submit-chapter');
          const hint=document.getElementById('hint-submit');
          if(btn){btn.disabled=!cf;btn.style.opacity=cf?'1':'.5';}
          if(hint) hint.style.display=cf?'none':'block';
        } else if(isLast){
          const af=CHAPTERS.every(c=>c.sections.every(s=>s.verses.every(v2=>(eAns[vKey(v2.v)]||'').trim()!=='')));
          const btn=document.getElementById('btn-submit-all');
          const hint=document.getElementById('hint-submit');
          if(btn){btn.disabled=!af;btn.style.opacity=af?'1':'.5';}
          if(hint) hint.style.display=af?'none':'block';
        }
      };
      ta.onkeydown=function(e){
        if(e.key!=='Enter'||e.shiftKey) return;
        if(e.isComposing||e.keyCode===229) return; // 한글 IME 조합 중 엔터 무시
        e.preventDefault();
        eAns[k]=ta.value;
        if(vi+1<allVerses.length){
          const nk=vKey(allVerses[vi+1].v);
          const nta=document.getElementById('ta_e_'+nk);
          if(nta){scrollToEl('ta_e_'+nk);setTimeout(()=>{nta.focus();nta.select();},80);}
        } else if(!isLast){ go(current+1); }
      };
    });
    if(current>0) scrollToEl('ta_e_'+vKey(allVerses[0].v));
    setTimeout(()=>{ const ta=document.getElementById('ta_e_'+vKey(allVerses[0].v)); if(ta) ta.focus(); },80);
  }
}

function eSubmitChapter(idx){
  const ch=CHAPTERS[idx];
  ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    const ta=document.getElementById('ta_e_'+k);
    if(ta) eAns[k]=ta.value;
  }));
  eChecked['ch_'+ch.id]=true;
  ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    if(!isMatch(eAns[k]||'',v.text)){ wrongNote['e_'+k]={vref:v.v,answer:v.text,ua:eAns[k]||''}; }
    else { delete wrongNote['e_'+k]; }
  }));
  // 100점 체크 (장 단위)
  const allOk=ch.sections.every(s=>s.verses.every(v=>isMatch(eAns[vKey(v.v)]||'',v.text)));
  if(allOk){ setTimeout(showPerfect,400); }
  render();
}
function eRetryChapter(idx){
  const ch=CHAPTERS[idx];
  delete eChecked['ch_'+ch.id];
  ch.sections.forEach(sec=>sec.verses.forEach(v=>{ eAns[vKey(v.v)]=''; }));
  render();
}

function eSubmitAll(){
  CHAPTERS.forEach(ch=>ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    const ta=document.getElementById('ta_e_'+k);
    if(ta) eAns[k]=ta.value;
  })));
  eChecked['final']=true;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  CHAPTERS.forEach(ch=>ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    if(!isMatch(eAns[k]||'',v.text)){ wrongNote['e_'+k]={vref:v.v,answer:v.text,ua:eAns[k]||''}; }
    else { delete wrongNote['e_'+k]; }
  })));
  showExamScore();
}
function restartExam(){
  eAns={}; eChecked={}; examStarted=false; timerSec=0;
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  current=0;
  EXAM_MODE_STATE = { step:'setup', selectedMode:'classic', selectedChapters:[], gradeMode:'bundle', bundles:[], bundleIdx:0 };
  render();
}

  let correct=0,total=0,wrong=[];
  CHAPTERS.forEach(ch=>ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    total++;
    const k=vKey(v.v);
    if(isMatch(eAns[k]||'',v.text)) correct++;
    else wrong.push({vref:v.v,answer:v.text,ua:eAns[k]||''});
  })));
  const pct=Math.round(correct/total*100);
  const msg=pct===100?'완벽합니다!':pct>=80?'아주 잘 하셨어요!':pct>=60?'조금만 더 연습해 봐요!':'반복 학습해 보세요.';
  if(pct===100){setTimeout(showPerfect,400);}
  const wrongItemsHtml=wrong.map(w=>'<div class="wrong-item"><div class="wq">'+escHtml(w.vref)+'</div><div class="wa">정답: '+escHtml(w.answer)+'</div>'+(w.ua?'<div style="font-size:12px;margin-top:4px">내 답: '+diffHtmlBox(w.ua,w.answer)+'</div>':'')+'</div>').join('');
  const wrongHtml=wrong.length>0?'<div class="wrong-list"><div class="wrong-list-title">틀린 절 ('+wrong.length+'개)</div>'+wrongItemsHtml+'</div>':'';
  document.getElementById('quiz-area').innerHTML=`
    <div class="score-screen">
      <div class="score-circle"><div class="score-num">${pct}%</div><div class="score-sub">${correct}/${total}절</div></div>
      <div class="score-msg">${msg}</div>
      <div class="stat-row">
        <span class="stat-chip" style="background:var(--accent-light);color:var(--accent-dark)">정답 ${correct}절</span>
        <span class="stat-chip" style="background:var(--warn-light);color:var(--warn)">오답 ${total-correct}절</span>
      </div>
      <div class="score-btn-row">

        <button class="primary" onclick="retryWrongExam()">오답만 다시 풀기</button>

      ${wrongHtml}

// ── 따라쓰기 모드 ──
let traceAns={}, traceChecked={}, traceRevealed={};

function renderTrace(){
  const app=document.getElementById('quiz-area');
  const ch=CHAPTERS[current];
  const total=CHAPTERS.length;
  const pct=Math.round(current/total*100);

  let dotsHtml='<div class="q-jump">';
  CHAPTERS.forEach((c,ci)=>{
    const allC=c.sections.every(s=>s.verses.every(v=>traceChecked[vKey(v.v)]));
    const allOk=allC&&c.sections.every(s=>s.verses.every(v=>isMatch(traceAns[vKey(v.v)]||'',v.text)));
    let cls='q-dot'+(ci===current?' current':'');
    if(allC) cls+=allOk?' done-correct':' done-wrong';
    dotsHtml+=`<button class="${cls}" onclick="go(${ci})">${c.ref.replace('계 ','').replace('장','')+'장'}</button>`;
  });
  dotsHtml+='</div>';

  let firstUncheckedKey=null;
  outer2: for(const sec of ch.sections){
    for(const v of sec.verses){
      if(!traceChecked[vKey(v.v)]){firstUncheckedKey='ta_tr_'+vKey(v.v);break outer2;}
    }
  }

  let versesContent='';
  ch.sections.forEach(sec=>{

    sec.verses.forEach(v=>{
      const k=vKey(v.v);
      const ua=traceAns[k]||'', isChecked=traceChecked[k], isRevealed=traceRevealed[k];
      const isCorrect=isChecked&&isMatch(ua,v.text);
      // 정답 표시 (따라쓰기용)
      const ansDisplay=`<div style="font-size:13px;line-height:1.75;padding:8px 12px;background:#f0f8f4;border-radius:6px;border:1px solid #c5e8d8;color:var(--accent-dark);margin-bottom:6px;user-select:none">${escHtml(v.text)}</div>`;
      let feedHtml='';
      if(isChecked){
        if(isCorrect){
          const strict=document.getElementById('chk-space').checked;
          const hasSpaceDiff=!strict&&ua.replace(/\s/g,'')===v.text.replace(/\s/g,'')&&ua!==v.text;
          feedHtml=hasSpaceDiff
            ?`<div class="feedback correct">✓ 맞았어요! (띄어쓰기 교정)<br><span style="font-size:12px">내 답: ${spaceCorrection(ua,v.text)}</span></div>`
            :`<div class="feedback correct">✓ 정확히 맞았어요!</div>`;
        } else {
          const u=normStr(ua,false),a=normStr(v.text,false);
          const match=[...u].filter((c,i)=>c===a[i]).length;
          const pct2=a.length>0?Math.round(match/a.length*100):0;
          feedHtml=`<div class="feedback wrong"><div style="margin-bottom:4px">틀렸어요 (${pct2}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(ua,v.text)}</div></div>`;
          if(isRevealed) feedHtml+=`<div class="answer-box"><strong>정답:</strong> ${escHtml(v.text)}</div>`;
        }
      }
      const btnHtml=isChecked
        ?`<div class="btn-row">${!isRevealed&&!isCorrect?`<button onclick="trReveal('${k}')">정답 보기</button>`:''}<button onclick="trRetry('${k}')">다시 쓰기</button></div>`
        :`<div class="btn-row"><button class="primary" onclick="trCheck('${k}','${v.v}')">확인</button></div>`;
      versesContent+=`<div class="verse-item"><div class="verse-label">${v.v}</div>${ansDisplay}<textarea id="ta_tr_${k}" style="min-height:${calcHeight(v.text)}" placeholder="위 성구를 따라 쓰세요...">${escHtml(ua)}</textarea>${feedHtml}${btnHtml}</div>`;
    });
  });

  const allChecked=ch.sections.every(s=>s.verses.every(v=>traceChecked[vKey(v.v)]));
  const isLast=current===CHAPTERS.length-1;
  const allDone=CHAPTERS.every(c=>c.sections.every(s=>s.verses.every(v=>traceChecked[vKey(v.v)])));
  let navHtml='';
  if(allChecked){
    navHtml=`<div class="nav-row">
      ${current>0?`<button onclick="go(${current-1})">← 이전</button>`:'<span></span>'}
      <div class="nav-right">
        ${!isLast?`<button class="primary" onclick="go(${current+1})">다음 →</button>`:''}
        ${isLast||allDone?`<button class="primary" onclick="showTraceScore()">결과 보기 →</button>`:''}
      </div>
    </div>`;
  }

  app.innerHTML=`
    <div class="progress-row">
      <span class="prog-label">${current+1} / ${total}</span>
      <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
      <span class="score-pill" style="background:#f0f0ff;color:#3333aa">따라쓰기</span>
    </div>
    ${dotsHtml}
    <div class="card">
      <span class="q-num">성구 ${ch.id}</span>
      <div class="q-title">${ch.ref}</div>
      <div class="q-subtitle">${ch.title}</div>
      ${versesContent}
    </div>
    ${navHtml}`;

  ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);
    const ta=document.getElementById('ta_tr_'+k);
    if(!ta) return;
    bindTraceEnter(ta, k, v.v);
  }));

  if(firstUncheckedKey){
    const firstVKey='ta_tr_'+vKey(CHAPTERS[current].sections[0].verses[0].v);
    const isVeryFirst = (current===0 && firstUncheckedKey===firstVKey);
    if(!isVeryFirst) scrollToEl(firstUncheckedKey);
    setTimeout(()=>{ const ta=document.getElementById(firstUncheckedKey); if(ta) ta.focus(); },80);
  }
}

function bindTraceEnter(ta, k, vref){
  ta.onkeydown=function(e){
    if(e.key!=='Enter'||e.shiftKey) return;
    if(e.isComposing||e.keyCode===229) return; // 한글 IME 조합 중 엔터 무시
    e.preventDefault();
    if(!traceChecked[k]){
      trCheck(k, vref);
    } else {
      traceChecked[k]=false;
      traceAns[k]='';
      ta.value='';
      ta.readOnly=false;
      const oldFeed=document.getElementById('trfeed_'+k);
      if(oldFeed) oldFeed.remove();
      const rect=ta.getBoundingClientRect();
      const viewH=window.innerHeight;
      const offset=window.scrollY+rect.top-(viewH/2-rect.height/2);
      window.scrollTo({top:Math.max(0,offset),behavior:'smooth'});
      setTimeout(()=>{ ta.focus(); },60);
      bindTraceEnter(ta, k, vref);
    }
  };
}

function trCheck(k,vref){
  const ta=document.getElementById('ta_tr_'+k);
  traceAns[k]=ta?ta.value:(traceAns[k]||'');
  traceChecked[k]=true;
  let ans='';
  for(const ch of CHAPTERS) for(const sec of ch.sections) for(const v of sec.verses){ if(vKey(v.v)===k){ans=v.text;break;} }
  const correct=isMatch(traceAns[k],ans);
  if(!correct){ wrongNote['tr_'+k]={vref,answer:ans,ua:traceAns[k]}; }
  else { delete wrongNote['tr_'+k]; }

  if(correct){
    render();
    trMoveNext(k);
  } else {
    const u=normStr(traceAns[k],false), a=normStr(ans,false);
    const match=[...u].filter((c,i)=>c===a[i]).length;
    const pct2=a.length>0?Math.round(match/a.length*100):0;
    const feedHtml=`<div class="feedback wrong" id="trfeed_${k}"><div style="margin-bottom:4px">틀렸어요 (${pct2}% 일치)</div><div style="font-size:12px">내 답: ${diffHtmlBox(traceAns[k],ans)}</div></div>`;
    const oldFeed=document.getElementById('trfeed_'+k);
    if(oldFeed) oldFeed.remove();
    if(ta){
      ta.insertAdjacentHTML('afterend', feedHtml);
      ta.readOnly=false;
      ta.focus();
      bindTraceEnter(ta, k, vref);
    }
  }
}
function trReveal(k){ traceRevealed[k]=true; render(); }
function trRetry(k){
  traceChecked[k]=false; traceRevealed[k]=false; traceAns[k]='';
  render();
  setTimeout(()=>{ const ta=document.getElementById('ta_tr_'+k); if(ta){ta.value='';ta.focus();} },30);
}
function trMoveNext(k){
  const ch=CHAPTERS[current];
  let passedCurrent=false, nextKey=null;
  outer3: for(const sec of ch.sections){
    for(const v of sec.verses){
      const vk=vKey(v.v);
      if(vk===k){passedCurrent=true;continue;}
      if(passedCurrent&&!traceChecked[vk]){nextKey='ta_tr_'+vk;break outer3;}
    }
  }
  if(nextKey){
    scrollToEl(nextKey);
    setTimeout(()=>{ const ta=document.getElementById(nextKey); if(ta){ta.focus();ta.select();} },80);
  } else {
    setTimeout(()=>{
      const ta=document.getElementById('ta_tr_'+k);
      if(ta){
        ta.focus();
        ta.onkeydown=function(e){
          if(e.key!=='Enter'||e.shiftKey) return;
          if(e.isComposing||e.keyCode===229) return;
          e.preventDefault();
          if(current<CHAPTERS.length-1) go(current+1); else showTraceScore();
        };
      }
    },30);
  }
}
function showTraceScore(){
  let correct=0,wrong=[];
  CHAPTERS.forEach(ch=>ch.sections.forEach(sec=>sec.verses.forEach(v=>{
    const k=vKey(v.v);

    else wrong.push({vref:v.v,answer:v.text,ua:traceAns[k]||''});
  })));
  const tp=totalVerses(),pct=Math.round(correct/tp*100);
  const msg=pct===100?'완벽합니다!':pct>=80?'아주 잘 하셨어요!':pct>=60?'조금만 더 연습해 봐요!':'반복 학습해 보세요.';
  if(pct===100) setTimeout(showPerfect,400);
  const wrongItemsHtml=wrong.map(w=>'<div class="wrong-item"><div class="wq">'+escHtml(w.vref)+'</div><div class="wa">정답: '+escHtml(w.answer)+'</div>'+(w.ua?'<div style="font-size:12px;margin-top:4px">내 답: '+diffHtmlBox(w.ua,w.answer)+'</div>':'')+'</div>').join('');
  const wrongHtml=wrong.length>0?'<div class="wrong-list"><div class="wrong-list-title">틀린 절 ('+wrong.length+'개)</div>'+wrongItemsHtml+'</div>':'';

  runConfetti(canvas);
  setTimeout(()=>{ overlay.style.display='none'; canvas.style.display='none'; },4000);

function runConfetti(canvas){
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const pieces=Array.from({length:120},()=>({
    x:Math.random()*canvas.width, y:Math.random()*canvas.height-canvas.height,
    r:Math.random()*6+4, d:Math.random()*80+20,
    color:['#2d6a4f','#52b788','#c9a84c','#f4a261','#e76f51','#264653'][Math.floor(Math.random()*6)],
    tilt:Math.random()*10-10, tiltAngle:0, tiltSpeed:Math.random()*.1+.05
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(p=>{
      ctx.beginPath(); ctx.lineWidth=p.r/2; ctx.strokeStyle=p.color;
      ctx.moveTo(p.x+p.tilt+p.r/4,p.y); ctx.lineTo(p.x+p.tilt,p.y+p.tilt+p.r/4); ctx.stroke();
      p.tiltAngle+=p.tiltSpeed;
      p.y+=Math.cos(frame/20+p.d)+1+p.r/4;
      p.x+=Math.sin(frame/30)*.5;
      p.tilt=Math.sin(p.tiltAngle)*12;
      if(p.y>canvas.height){ p.y=-10; p.x=Math.random()*canvas.width; }
    });
    frame++;
    if(frame<240) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}

// 핵심 단어/구절 선택: 어절(공백 기준) 단위로 2~3개를 무작위 선택해 빈칸 처리
// difficulty: 'low'|'mid'|'high' — 빈칸 개수와 길이 조절
function pickBlanksForVerse(text, difficulty){
  difficulty = difficulty || 'mid';
  // 어절 분리 (공백 기준), 각 어절의 시작/끝 인덱스 기록
  const words = [];
  let idx = 0;
  text.split(' ').forEach(w=>{
    if(w.length>0) words.push({word:w, start:idx, end:idx+w.length});
    idx += w.length+1;
  });
  if(words.length===0) return [];

  // 난이도별 설정: [최소빈칸수, 최대빈칸수, 최소구절길이, 최대구절길이]
  const cfg = {
    low:  {nMin:1, nMax:2, lenMin:1, lenMax:2},
    mid:  {nMin:2, nMax:3, lenMin:2, lenMax:4},
    high: {nMin:3, nMax:5, lenMin:3, lenMax:6},
  }[difficulty] || {nMin:2, nMax:3, lenMin:2, lenMax:4};

  const targetN = cfg.nMin + Math.floor(Math.random()*(cfg.nMax-cfg.nMin+1));
  const spanLen = ()=> cfg.lenMin + Math.floor(Math.random()*(cfg.lenMax-cfg.lenMin+1));

  // 최소 1개 어절 간격을 두고 n개의 구절(span) 무작위 배치
  const used = new Array(words.length).fill(false); // 빈칸으로 쓰였거나 간격으로 예약된 칸
  const spans = [];
  let attempts = 0;
  const maxAttempts = 80;
  while(spans.length<targetN && attempts<maxAttempts){
    attempts++;
    const len = Math.min(spanLen(), words.length);
    if(len<1) continue;
    const startIdx = Math.floor(Math.random()*(words.length-len+1));
    const endIdxExcl = startIdx+len;
    // 앞뒤로 1칸씩 여유를 둔 범위가 비어있는지 확인 (다른 빈칸과 붙지 않도록)
    let overlap = false;
    for(let i=Math.max(0,startIdx-1); i<Math.min(words.length,endIdxExcl+1); i++){
      if(used[i]){ overlap=true; break; }
    }
    if(overlap) continue;
    for(let i=startIdx;i<endIdxExcl;i++) used[i]=true;
    const first = words[startIdx], last = words[endIdxExcl-1];
    const phrase = words.slice(startIdx, endIdxExcl).map(w=>w.word).join(' ');
    spans.push({ word:phrase, start:first.start, end:last.end });
  }
  spans.sort((a,b)=>a.start-b.start);
  return spans;
}

function buildVerseHtml(text, blanks, blankId, savedAnswers, checked){
  // blanks: [{start,end,word}], 정렬되어 있음
  let html='', cursor=0;
  blanks.forEach((b,bi)=>{
    html += escHtml(text.slice(cursor,b.start));
    const inputKey = `bk_${blankId}_${bi}`;
    const savedVal = (savedAnswers && savedAnswers[inputKey]) || '';
    let cls = 'blank-input';
    let answerHint = '';
    if(checked){
      const ok = isMatch(savedVal, b.word);
      cls += ok ? ' bcorrect' : ' bwrong';
      if(!ok){
        answerHint = `<span class="blank-answer-hint">정답: ${escHtml(b.word)}</span>`;
      }
    }
    html += `<span class="blank-wrap"><input type="text" class="${cls}" id="${inputKey}" data-answer="${escHtml(b.word)}" data-key="${inputKey}" autocomplete="off" style="width:${Math.max(3,b.word.length)*1.1}em" value="${escHtml(savedVal)}" ${checked?'readonly':''}>${answerHint}</span>`;
    cursor = b.end;
  });
  html += escHtml(text.slice(cursor));
  return html;
}

function startBlankQuiz(){
  const chapterIdxs = BLANK_STATE.selectedChapters;
  const subMode = BLANK_STATE.subMode;
  const groups = [];

  chapterIdxs.forEach(ci=>{
    const ch = CHAPTERS_RAW[ci];
    // 해당 장의 모든 절 평탄화
    const allVerses = [];
    ch.sections.forEach(sec=>sec.verses.forEach(v=>allVerses.push(v)));

    if(subMode==='A'){
      // 절별로 그룹 하나씩 (장 단위로 채점) - 기본은 원래 순서
      const verses = allVerses.map(v=>({vref:v.v, text:v.text, blanks: pickBlanksForVerse(v.text, BLANK_STATE.difficulty)}));
      groups.push({ chapterIdx:ci, chapterRef:ch.ref, mode:'A', verses, allVerses, verseOrderShuffled:false, checked:false, answers:{} });
    } else {
      // B, C: 기본은 원래 순서대로 2~5개씩 묶음 구성
      const bundleGroups = buildOrderedBundles(allVerses, subMode);
      groups.push({ chapterIdx:ci, chapterRef:ch.ref, mode:subMode, bundles:bundleGroups, allVerses, verseOrderShuffled:false, checked:false, answers:{} });
    }
  });

  BLANK_STATE.groups = groups;
  BLANK_STATE.groupIdx = 0;
  BLANK_STATE.step = 'quiz';
  render();
}
